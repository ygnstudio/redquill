name: verify

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # --legacy-peer-deps：obsidian 的 peer 依赖（@codemirror/state@6.5.0）滞后于
        # 我们为 CM6 扩展对齐的内置线（state ^6.7.2 / view ^6.43.11），peer 冲突属声明滞后，忽略
        run: npm ci --legacy-peer-deps

      # vitest 单测（tests/unit/，直接测 src/ 真源码 22 用例）。
      # 旧版 16 套 Python 回归（tests/verify_*.py，已归档 tests/legacy/）针对
      # 拆分前的 main.ts 文本结构，与 v1.1.0 起的代码不再适配，由 vitest 取代。
      - name: Unit tests (vitest)
        run: npm test

      - name: Build (main.js)
        run: npm run build
