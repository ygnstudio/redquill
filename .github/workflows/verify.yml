name: verify

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: npm ci

      - name: Build (main.js)
        run: npm run build

      # 全量回归：13 套红(公文线 v0.4→v0.12) + 通用 v010 = 14 套，任一失败即红
      - name: Full regression (14 suites)
        run: |
          set -e
          for f in tests/verify_redhead.py tests/verify_v04.py tests/verify_v052.py \
                   tests/verify_v053.py tests/verify_v055.py tests/verify_v056.py \
                   tests/verify_v060.py tests/verify_v070.py tests/verify_v080.py \
                   tests/verify_v090.py tests/verify_v0100.py tests/verify_v0110.py \
                   tests/verify_v0120.py tests/verify_v010.py; do
            echo "== $f =="
            python3 "$f"
          done
          echo "All suites passed."
